name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt (Ubuntu package, as on the developer VMs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shfmt
      - name: ShellCheck
        run: shellcheck -x bootstrap.sh
      - name: Format check
        run: shfmt -d -i 2 -ci bootstrap.sh
      - name: Syntax check
        run: bash -n bootstrap.sh
